<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Object Detector PRO</title>

<!-- TensorFlow.js + COCO-SSD -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
    min-height:100vh;
}

header{
    padding:18px;
    text-align:center;
    background:linear-gradient(135deg,#087cff,#0044a8);
    box-shadow:0 5px 25px #0008;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:5px;
    opacity:.8;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.camera-box{
    position:relative;
    width:100%;
    max-width:900px;
    margin:auto;
    overflow:hidden;
    border-radius:20px;
    background:#000;
    box-shadow:0 0 30px #008cff55;
}

#video{
    display:block;
    width:100%;
    height:auto;
    min-height:300px;
    object-fit:cover;
    transform:scaleX(1);
}

#canvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

.status{
    margin:15px auto;
    padding:13px;
    border-radius:14px;
    max-width:900px;
    background:#101f33;
    border:1px solid #1d426b;
    text-align:center;
}

.status span{
    color:#42aaff;
    font-weight:bold;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin:15px 0;
}

button{
    border:none;
    border-radius:12px;
    padding:13px 18px;
    color:white;
    background:#087cff;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 15px #0005;
}

button:hover{
    filter:brightness(1.15);
}

button.stop{
    background:#d92727;
}

button.voice{
    background:#713cff;
}

button.secondary{
    background:#26384d;
}

.panel{
    max-width:900px;
    margin:auto;
    background:#101b2a;
    border:1px solid #1e344d;
    border-radius:18px;
    padding:15px;
}

.panel h2{
    margin-bottom:10px;
    font-size:18px;
}

#results{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
}

.item{
    background:#17283c;
    border-radius:12px;
    padding:12px;
    border-left:4px solid #1491ff;
}

.item b{
    display:block;
    font-size:17px;
}

.confidence{
    color:#63c1ff;
    margin-top:4px;
}

.loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000b;
    font-size:18px;
    z-index:5;
}

.hidden{
    display:none;
}

.info{
    margin-top:15px;
    text-align:center;
    color:#9db2c8;
    font-size:13px;
    line-height:1.6;
}

@media(max-width:600px){
    header h1{
        font-size:21px;
    }

    button{
        flex:1 1 42%;
    }

    .camera-box{
        border-radius:15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🤖 AI OBJECT DETECTOR</h1>
    <p>Deteksi benda di sekitar secara realtime</p>
</header>

<div class="container">

    <div class="camera-box">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>

        <div id="loading" class="loading">
            Memuat AI...
        </div>
    </div>

    <div class="status">
        Status:
        <span id="status">Menunggu...</span>
    </div>

    <div class="controls">
        <button onclick="startCamera()">📷 Mulai Kamera</button>
        <button class="stop" onclick="stopCamera()">⛔ Stop</button>
        <button class="voice" onclick="toggleVoice()">🔊 Suara: ON</button>
        <button class="secondary" onclick="switchCamera()">🔄 Ganti Kamera</button>
    </div>

    <div class="panel">
        <h2>🔎 Objek Terdeteksi</h2>
        <div id="results">
            <div class="item">
                Belum ada objek.
            </div>
        </div>
    </div>

    <div class="info">
        AI menggunakan model COCO-SSD melalui TensorFlow.js.<br>
        Hasil deteksi bergantung pada pencahayaan, jarak kamera,
        kualitas kamera, dan kemampuan model.
    </div>

</div>

<script>
let model = null;
let stream = null;
let running = false;
let voiceEnabled = true;
let facingMode = "environment";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const results = document.getElementById("results");
const loading = document.getElementById("loading");

let lastSpoken = "";
let lastSpeakTime = 0;

const translations = {
    person:"orang",
    bicycle:"sepeda",
    car:"mobil",
    motorcycle:"sepeda motor",
    airplane:"pesawat",
    bus:"bus",
    train:"kereta",
    truck:"truk",
    boat:"perahu",
    traffic_light:"lampu lalu lintas",
    fire_hydrant:"hidran",
    stop_sign:"rambu berhenti",
    parking_meter:"meter parkir",
    bench:"bangku",
    bird:"burung",
    cat:"kucing",
    dog:"anjing",
    horse:"kuda",
    sheep:"domba",
    cow:"sapi",
    elephant:"gajah",
    bear:"beruang",
    zebra:"zebra",
    giraffe:"jerapah",
    backpack:"tas ransel",
    umbrella:"payung",
    handbag:"tas tangan",
    tie:"dasi",
    suitcase:"koper",
    frisbee:"frisbee",
    skis:"ski",
    snowboard:"snowboard",
    sports_ball:"bola",
    kite:"layang-layang",
    baseball_bat:"tongkat baseball",
    baseball_glove:"sarung tangan baseball",
    skateboard:"skateboard",
    surfboard:"papan selancar",
    tennis_racket:"raket tenis",
    bottle:"botol",
    wine_glass:"gelas",
    cup:"cangkir",
    fork:"garpu",
    knife:"pisau",
    spoon:"sendok",
    bowl:"mangkuk",
    banana:"pisang",
    apple:"apel",
    sandwich:"sandwich",
    orange:"jeruk",
    broccoli:"brokoli",
    carrot:"wortel",
    hot_dog:"hot dog",
    pizza:"pizza",
    donut:"donat",
    cake:"kue",
    chair:"kursi",
    couch:"sofa",
    potted_plant:"tanaman",
    bed:"tempat tidur",
    dining_table:"meja makan",
    toilet:"toilet",
    tv:"televisi",
    laptop:"laptop",
    mouse:"mouse komputer",
    remote:"remote",
    keyboard:"keyboard",
    cell_phone:"ponsel",
    microwave:"microwave",
    oven:"oven",
    toaster:"pemanggang roti",
    sink:"wastafel",
    refrigerator:"kulkas",
    book:"buku",
    clock:"jam",
    vase:"vas",
    scissors:"gunting",
    teddy_bear:"boneka beruang",
    hair_drier:"pengering rambut",
    toothbrush:"sikat gigi"
};

function translate(label){
    return translations[label] || label.replaceAll("_"," ");
}

async function loadAI(){

    try{

        statusText.textContent = "Memuat model AI...";
        loading.classList.remove("hidden");

        model = await cocoSsd.load();

        loading.classList.add("hidden");

        statusText.textContent = "AI siap";

    }catch(error){

        console.error(error);

        statusText.textContent =
            "Gagal memuat AI. Periksa internet.";

        loading.textContent =
            "Gagal memuat model AI";

    }
}

async function startCamera(){

    if(!model){
        alert("AI masih dimuat. Tunggu sebentar.");
        return;
    }

    stopCamera();

    try{

        stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:facingMode,
                width:{ideal:1280},
                height:{ideal:720}
            },
            audio:false
        });

        video.srcObject = stream;

        await video.play();

        running = true;

        statusText.textContent =
            "Kamera aktif • Mendeteksi...";

        detectLoop();

    }catch(error){

        console.error(error);

        statusText.textContent =
            "Kamera gagal dibuka";

        alert(
            "Kamera tidak dapat dibuka.\n\n" +
            "Pastikan izin kamera diberikan dan halaman dibuka melalui HTTPS atau localhost."
        );
    }
}

function stopCamera(){

    running = false;

    if(stream){

        stream.getTracks().forEach(track=>{
            track.stop();
        });

        stream = null;
    }

    video.srcObject = null;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    statusText.textContent = "Kamera berhenti";
}

async function switchCamera(){

    facingMode =
        facingMode === "environment"
        ? "user"
        : "environment";

    if(running){
        await startCamera();
    }
}

function toggleVoice(){

    voiceEnabled = !voiceEnabled;

    const button =
        document.querySelector(".voice");

    button.textContent =
        voiceEnabled
        ? "🔊 Suara: ON"
        : "🔇 Suara: OFF";

    if(!voiceEnabled){
        speechSynthesis.cancel();
    }
}

function speak(text){

    if(!voiceEnabled) return;

    const now = Date.now();

    if(
        text === lastSpoken &&
        now - lastSpeakTime < 3500
    ){
        return;
    }

    lastSpoken = text;
    lastSpeakTime = now;

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "id-ID";
    utterance.rate = 0.95;
    utterance.pitch = 1;

    speechSynthesis.speak(utterance);
}

async function detectLoop(){

    if(!running) return;

    if(video.readyState < 2){

        requestAnimationFrame(detectLoop);
        return;
    }

    try{

        const predictions =
            await model.detect(video);

        drawDetections(predictions);

    }catch(error){

        console.error(error);

    }

    setTimeout(
        ()=>requestAnimationFrame(detectLoop),
        100
    );
}

function drawDetections(predictions){

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const filtered =
        predictions.filter(
            p => p.score >= 0.50
        );

    results.innerHTML = "";

    if(filtered.length === 0){

        results.innerHTML =
            `<div class="item">
                Tidak ada objek yang cukup yakin terdeteksi.
             </div>`;

        return;
    }

    let speechObject = null;

    filtered.forEach((prediction,index)=>{

        const [
            x,
            y,
            width,
            height
        ] = prediction.bbox;

        const label =
            translate(prediction.class);

        const percent =
            Math.round(prediction.score * 100);

        // Kotak
        ctx.strokeStyle = "#00aaff";
        ctx.lineWidth = 4;

        ctx.strokeRect(
            x,
            y,
            width,
            height
        );

        // Label background
        const text =
            `${label} ${percent}%`;

        ctx.font = "bold 18px Arial";

        const textWidth =
            ctx.measureText(text).width;

        ctx.fillStyle = "#008cff";

        ctx.fillRect(
            x,
            Math.max(0,y-30),
            textWidth+16,
            30
        );

        ctx.fillStyle = "#ffffff";

        ctx.fillText(
            text,
            x+8,
            Math.max(21,y-8)
        );

        // Panel hasil
        const item =
            document.createElement("div");

        item.className = "item";

        item.innerHTML = `
            <b>📦 ${label}</b>
            <div class="confidence">
                Keyakinan: ${percent}%
            </div>
        `;

        results.appendChild(item);

        // Ambil objek dengan confidence tertinggi
        if(
            !speechObject ||
            prediction.score > speechObject.score
        ){
            speechObject = prediction;
        }

    });

    // Suara
    if(speechObject){

        const label =
            translate(speechObject.class);

        const percent =
            Math.round(
                speechObject.score * 100
            );

        speak(
            `Terdeteksi ${label}, keyakinan ${percent} persen`
        );
    }

    statusText.textContent =
        `${filtered.length} objek terdeteksi`;
}

// Cegah error jika browser tidak mendukung kamera
if(!navigator.mediaDevices ||
   !navigator.mediaDevices.getUserMedia){

    statusText.textContent =
        "Browser tidak mendukung akses kamera";
}

// Muat AI
loadAI();
</script>

</body>
</html>
